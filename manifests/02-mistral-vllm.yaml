apiVersion: v1
kind: Namespace
metadata:
  name: llm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mistral
  namespace: llm
  labels:
    app: mistral
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mistral
  template:
    metadata:
      labels:
        app: mistral
    spec:
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 30
      volumes:
      - name: hf-cache
        persistentVolumeClaim:
          claimName: hf-cache
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      containers:
      - name: vllm
        image: nvcr.io/nvidia/vllm:25.11-py3
        imagePullPolicy: IfNotPresent
        command:
        - vllm
        - serve
        args:
        - mistralai/Mistral-7B-Instruct-v0.3
        - --host=0.0.0.0
        - --max-model-len=8192
        - --gpu-memory-utilization=0.7
        - --tokenizer-mode=mistral
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
        - name: HF_HOME
          value: /root/.cache/huggingface
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: TRANSFORMERS_OFFLINE
          value: "1"
        ports:
        - name: http
          containerPort: 8000
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 120
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 12
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: 24Gi
          requests:
            nvidia.com/gpu: 1
            memory: 12Gi
        volumeMounts:
        - name: hf-cache
          mountPath: /root/.cache/huggingface
        - name: shm
          mountPath: /dev/shm
---
apiVersion: v1
kind: Service
metadata:
  name: mistral
  namespace: llm
  labels:
    app: mistral
spec:
  selector:
    app: mistral
  ports:
  - name: http
    port: 8000
    targetPort: 8000
