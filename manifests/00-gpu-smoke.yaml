apiVersion: v1
kind: Namespace
metadata:
  name: llm
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-smoke
  namespace: llm
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: gpu-smoke
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      containers:
      - name: gpu-smoke
        image: nvcr.io/nvidia/vllm:25.11-py3
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -lc
        args:
        - |
          echo "=== NVIDIA GPU smoke test ==="
          nvidia-smi
          echo ""
          echo "GPU smoke test completed."
        resources:
          limits:
            nvidia.com/gpu: 1
          requests:
            nvidia.com/gpu: 1
